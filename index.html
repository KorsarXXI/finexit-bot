<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FinExit — Личный финансовый навигатор</title>

  <!-- iOS PWA мета-теги для добавления на экран «Домой» -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinExit" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Единственный внешний скрипт: Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* =========================================================================
       ДИЗАЙН-ТОКЕНЫ И БАЗОВЫЕ СТИЛИ (ЧИСТЫЙ CSS, БЕЗ ВНЕШНИХ ЗАВИСИМОСТЕЙ)
       ========================================================================= */
    :root {
      --bg: #0d1117;
      --bg-outer: #070a0f;
      --card: #161b22;
      --card-soft: #1f2630;
      --card-hover: #262f3b;
      --border: rgba(240, 246, 252, 0.08);
      --border-strong: rgba(240, 246, 252, 0.16);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --purple: #a855f7;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-outer);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* Контейнер мобильного приложения */
    .app-shell {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.65);
      overflow-x: hidden;
    }

    /* Всплывающие уведомления (Тосты) */
    .toast-root {
      position: fixed;
      top: calc(12px + var(--sat));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 420px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1f2937;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      animation: slideDown 0.22s ease-out;
    }

    .toast.success { background: #064e3b; border-color: rgba(16, 185, 129, 0.5); }
    .toast.warn { background: #7f1d1d; border-color: rgba(239, 68, 68, 0.5); }
    .toast.info { background: #1e293b; border-color: rgba(59, 130, 246, 0.45); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-in {
      animation: fadeUp 0.2s ease-out both;
    }

    /* Шапка приложения */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(12px + var(--sat)) 16px 10px;
      background: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #06281e;
      font-weight: 900;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sync-badge.cloud {
      color: var(--emerald);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: transform 0.12s, background 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Основной скроллируемый контент */
    .main-content {
      flex: 1;
      padding: 12px 16px calc(92px + var(--sab));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Карточки */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
    }

    .card-soft {
      background: var(--card-soft);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    /* Герой-карточка «Свободно на сегодня» */
    .hero-card {
      border-radius: 24px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #132a24 0%, #161b22 55%, #111827 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hero-card.danger {
      background: linear-gradient(145deg, #450a0a 0%, #2a0d12 60%, #161b22 100%);
      border-color: rgba(239, 68, 68, 0.55);
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.2);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .hero-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--emerald);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-card.danger .hero-label {
      color: #fca5a5;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      white-space: nowrap;
    }

    .hero-amount {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 6px 0 10px;
    }

    .hero-card.danger .hero-amount {
      color: #fecaca;
    }

    .mentor-box {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #e6edf3;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Прогресс-бары */
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Поля ввода и кнопки */
    .input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .input:focus {
      border-color: var(--emerald);
    }

    .input::placeholder {
      color: #6e7681;
    }

    .input-lg {
      font-size: 18px;
      font-weight: 800;
      padding: 13px 14px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.12s, opacity 0.15s, background 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: var(--emerald);
      color: #042419;
    }

    .btn-blue {
      background: var(--blue);
      color: #ffffff;
    }

    .btn-amber {
      background: var(--amber);
      color: #1f1300;
    }

    .btn-soft {
      background: var(--card-soft);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-danger-soft {
      background: var(--red-soft);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-sm {
      padding: 9px 12px;
      font-size: 12px;
      border-radius: 12px;
    }

    /* Умный быстрый ввод */
    .quick-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .quick-input-wrap {
      position: relative;
      flex: 1;
    }

    .quick-input-wrap .input {
      padding-right: 44px;
    }

    .voice-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .voice-btn.listening {
      background: var(--red);
      color: #fff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .chip:active {
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* Сетки и утилиты */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stack-sm {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0;
    }

    .muted {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Списки транзакций и долгов */
    .tx-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .tx-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: var(--card-soft);
      flex-shrink: 0;
    }

    .tx-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tx-sum {
      font-size: 14px;
      font-weight: 800;
    }

    .tx-sum.inc {
      color: var(--emerald);
    }

    .del-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #6e7681;
      transition: color 0.15s, background 0.15s;
    }

    .del-btn:hover, .del-btn:active {
      color: var(--red);
      background: var(--red-soft);
    }

    /* Переключатель сегментов */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #0d1117;
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .seg-btn {
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .seg-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .seg-btn.active.emerald {
      background: var(--emerald);
      color: #042419;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .seg-btn.active.red {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Ползунок симулятора долгов */
    input[type="range"].fx-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #262f3b;
      outline: none;
      margin: 8px 0;
    }

    input[type="range"].fx-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--emerald);
      border: 3px solid #0d1117;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);
      cursor: pointer;
    }

    /* Карточка долга */
    .debt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .debt-card.priority {
      border-color: rgba(239, 68, 68, 0.65);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .badge-red { background: var(--red-soft); color: #fca5a5; }
    .badge-emerald { background: var(--emerald-soft); color: #6ee7b7; }
    .badge-blue { background: var(--blue-soft); color: #93c5fd; }
    .badge-amber { background: var(--amber-soft); color: #fcd34d; }
    .badge-muted { background: var(--card-soft); color: var(--text-muted); }

    /* Онбординг */
    .ob-wrap {
      flex: 1;
      padding: calc(16px + var(--sat)) 18px calc(24px + var(--sab));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .ob-steps {
      display: flex;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .ob-step-bar {
      height: 5px;
      flex: 1;
      border-radius: 999px;
      background: var(--card-soft);
      transition: background 0.2s;
    }

    .ob-step-bar.active {
      background: var(--emerald);
    }

    .choice-card {
      width: 100%;
      text-align: left;
      padding: 14px;
      border-radius: 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .choice-card.selected {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.08);
    }

    .choice-emoji {
      font-size: 24px;
      line-height: 1;
      margin-top: 2px;
    }

    /* Нижняя навигация (4 вкладки) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 30;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(10px + var(--sab));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 14px;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }

    .nav-btn.active {
      color: var(--emerald);
      background: var(--emerald-soft);
    }

    .nav-btn span {
      font-size: 11px;
      font-weight: 700;
    }

    /* Модальные окна (без alert / confirm) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    @media (min-width: 500px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      background: #161b22;
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      animation: fadeUp 0.18s ease-out;
    }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      border-radius: 14px;
      background: var(--card-soft);
      border: 1.5px solid transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .cat-btn.active {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: var(--text);
    }

    /* Canvas для Stories */
    .story-canvas-wrap {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    #stories-canvas {
      width: 190px;
      height: auto;
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    /* Заглушки пустых списков */
    .empty-box {
      text-align: center;
      padding: 26px 16px;
      background: var(--card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-xl);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="toast-root" class="toast-root"></div>

      // =========================================================================

      const LOCAL_KEY = 'finexit_state_v1';

              tg.expand();
              if (tg.setHeaderColor) {

              }
              if (tg.setBackgroundColor) {
                try { tg.setBackgroundColor('#0d1117'); } catch (_) {}
              }
              if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
                this.userName = tg.initDataUnsafe.user.first_name;
              }
              const supportsCloud = Boolean(
                tg.CloudStorage &&
                typeof tg.CloudStorage.getItems === 'function' &&
                typeof tg.CloudStorage.setItem === 'function' &&
                (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.9'))
              );
              this.hasCloud = supportsCloud;
              this.status = supportsCloud ? 'cloud' : 'local';
            }
          } catch (err) {
            this.isTelegram = false;
            this.hasCloud = false;
            this.status = 'local';
          }
        },

        haptic(type) {
          try {
            if (this.isTelegram && this.tg && this.tg.HapticFeedback) {
              this.tg.HapticFeedback.impactOccurred(type || 'light');
            }
          } catch (_) {}
        },

        loadLocal() {
          try {
            const raw = localStorage.getItem(LOCAL_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch (_) {
            return null;
          }
        },

        saveLocal(data) {
          try {
            localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
          } catch (_) {}
        },

        _getItems(keys) {
          return new Promise((resolve, reject) => {
            try {
              this.tg.CloudStorage.getItems(keys, (err, vals) => {
                if (err) reject(err);
                else resolve(vals || {});
              });
            } catch (e) {
              reject(e);
            }
          });
        },

        _setItem(key, val) {
          return new Promise((resolve, reject) => {
            try {
              this.tg.CloudStorage.setItem(key, val, (err, ok) => {
                if (err) reject(err);
                else resolve(ok);
              });
            } catch (e) {
              reject(e);
            }
          });
        },

        _removeItems(keys) {
          return new Promise((resolve) => {
            if (!keys || !keys.length) return resolve(true);
            try {
              this.tg.CloudStorage.removeItems(keys, () => resolve(true));
            } catch (_) {
              resolve(false);
            }
          });
        },

        async loadCloud() {
          if (!this.hasCloud) return null;
          this.status = 'syncing';
          updateStorageBadges();
          try {
            const metaObj = await this._getItems(['fx_meta']);
            if (!metaObj || !metaObj.fx_meta) {
              this.status = 'cloud';
              updateStorageBadges();
              return null;
            }
            const meta = JSON.parse(metaObj.fx_meta);
            const count = Number(meta.chunks) || 0;
            this.lastChunkCount = count;
            if (count <= 0) {
              this.status = 'cloud';
              updateStorageBadges();
              return null;
            }
            const keys = [];
            for (let i = 0; i < count; i++) keys.push('fx_c_' + i);
            const parts = await this._getItems(keys);
            let joined = '';
            for (let i = 0; i < count; i++) {
              if (typeof parts['fx_c_' + i] !== 'string') throw new Error('Broken chunk');
              joined += parts['fx_c_' + i];
            }
            const decoded = meta.enc === 'uri' ? decodeURIComponent(joined) : joined;
            this.status = 'cloud';
            updateStorageBadges();
            return JSON.parse(decoded);
          } catch (_) {
            this.status = 'fallback';
            updateStorageBadges();
            return null;
          }
        },

        async saveCloud(data) {
          this.saveLocal(data);
          if (!this.hasCloud) return true;
          this.status = 'syncing';
          updateStorageBadges();
          try {
            // encodeURIComponent гарантирует чистый ASCII (1 символ = 1 байт)
            const encoded = encodeURIComponent(JSON.stringify(data));
            const chunks = [];
            for (let i = 0; i < encoded.length; i += CHUNK_LIMIT) {
              chunks.push(encoded.slice(i, i + CHUNK_LIMIT));
            }

            let oldCount = this.lastChunkCount;
            if (oldCount === 0) {
              try {
                const oldMeta = await this._getItems(['fx_meta']);
                if (oldMeta && oldMeta.fx_meta) {
                  oldCount = Number(JSON.parse(oldMeta.fx_meta).chunks) || 0;
                }
              } catch (_) {}
            }

            // Сначала записываем все чанки
            for (let i = 0; i < chunks.length; i++) {
              await this._setItem('fx_c_' + i, chunks[i]);
            }

            // Затем обновляем метаданные
            await this._setItem('fx_meta', JSON.stringify({
              chunks: chunks.length,
              updatedAt: data.updatedAt || Date.now(),
              enc: 'uri',
            }));

            // Удаляем лишние старые чанки, если объем уменьшился
            if (oldCount > chunks.length) {
              const stale = [];
              for (let i = chunks.length; i < oldCount; i++) stale.push('fx_c_' + i);
              await this._removeItems(stale);
            }

            this.lastChunkCount = chunks.length;
            this.status = 'cloud';
            updateStorageBadges();
            return true;
          } catch (_) {
            this.status = 'fallback';
            updateStorageBadges();
            return false;
          }
        },

        scheduleSave(data) {
          this.saveLocal(data);
          if (!this.hasCloud) return;
          clearTimeout(this.debounceTimer);
          this.status = 'syncing';
          updateStorageBadges();
          this.debounceTimer = setTimeout(() => {
            this.saveCloud(data);
          }, 400);

        Здоровье: ['аптек', 'лекарств', 'врач', 'клиник', 'стоматолог', 'анализ', 'витамин', 'спортзал', 'фитнес', 'массаж', 'больниц'],
        Досуг: ['кино', 'театр', 'бар', 'подписк', 'яндекс плюс', 'игр', 'steam', 'цветы', 'подарок', 'кальян', 'боулинг', 'концерт', 'пиво', 'вино'],

      const INCOME_WORDS = ['зарплат', 'зп', 'аванс', 'зачислен', 'пришло', 'доход', 'преми', 'стипенд', 'кэшбэк', 'кешбэк', 'подработк', 'поступлен', 'вернули'];

      function guessCategory(text) {
        const lower = text.toLowerCase();
        for (const cat in KEYWORD_MAP) {
          if (KEYWORD_MAP[cat].some((w) => lower.indexOf(w) !== -1)) {
            return cat;
          }
        }
        return 'Прочее';
      }

      function parseQuickInput(raw) {
        const clean = (raw || '').trim();
        if (!clean) return [];

        // Разбиваем фразу на отдельные операции по "и", запятым, точкам с запятой и переносам строк
        const segments = clean
          .split(/(?:\s+и\s+|;\s*|\n+|,\s*(?=[а-яА-Яa-zA-Z+-]))/i)
          .map((s) => s.trim())
          .filter(Boolean);

        const today = getTodayISO();
        const now = Date.now();
        const parsed = [];

        segments.forEach((seg, idx) => {
          const m = seg.match(/([+-])?\s*(\d{1,3}(?:\s\d{3})+|\d+(?:[.,]\d{1,2})?)\s*(к|k|тыс\.?|р\.?|руб\.?|₽)?/i);
          if (!m) return;

          const sign = m[1];
          let amount = parseFloat(m[2].replace(/\s+/g, '').replace(',', '.'));
          if (isNaN(amount) || amount <= 0) return;

          const unit = (m[3] || '').toLowerCase();
          if (unit === 'к' || unit === 'k' || unit.indexOf('тыс') === 0) amount *= 1000;
          amount = Math.round(amount);

          const lower = seg.toLowerCase();
          const isIncome = sign === '+' || INCOME_WORDS.some((w) => lower.indexOf(w) !== -1);

          let title = seg
            .replace(m[0], ' ')
            .replace(/\b(покупка|оплата|списание|зачисление|перевод|карта|мир|visa|mastercard|рубли|рублей|руб|р)\b/gi, ' ')
            .replace(/[₽*•:]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          if (!title) title = isIncome ? 'Пополнение' : 'Покупка';
          else title = title.charAt(0).toUpperCase() + title.slice(1);

          parsed.push({
            id: 'tx-' + now + '-' + idx + '-' + Math.random().toString(36).slice(2, 6),
            title,
            amount,
            type: isIncome ? 'income' : 'expense',
            category: isIncome ? 'Доход' : guessCategory(seg),
            date: today,
          });
        });

        return parsed;
      }

      function getMentorText(tone, type, p) {

          if (tone === 'sergeant') return 'Тревога! Дефицит ' + formatRub(d.deficit) + '. Отставить любые лишние траты, переходим в режим жесткой защиты бюджета!';

          return 'Сейчас намечается дефицит ' + formatRub(d.deficit) + '. Не переживай: поставим лишние траты на паузу и аккуратно пройдем дни до дохода.';
        }
        if (type === 'ok') {
          if (tone === 'sergeant') return 'Лимит под контролем! Всё, что не потратишь сегодня, сработает в плюс завтра или ускорит закрытие долгов.';
          if (tone === 'bro') return 'Идешь уверенно! Сэкономишь сегодня часть лимита — завтра дышать будет ещё легче.';
          return 'Комфортный и спокойный темп. Ты уверенно держишься в рамках своего дневного ориентира.';
        }
        if (type === 'expense') {
          if (tone === 'sergeant') return 'Расход ' + formatRub(d.amount) + ' зафиксирован. Дневной лимит пересчитан!';
          if (tone === 'bro') return 'Улетело ' + formatRub(d.amount) + ' — записал! Надеюсь, покупка того стоила 😉';
          return 'Записал ' + formatRub(d.amount) + '. Дневной ориентир обновился, всё под контролем.';
        }
        if (type === 'income') {
          if (tone === 'sergeant') return 'Пополнение +' + formatRub(d.amount) + ' принято! Не трать всё сразу — укрепи подушку или досрочку.';
          if (tone === 'bro') return 'Опа, +' + formatRub(d.amount) + '! Приятный плюс к балансу и настроению 🔥';
          return 'Отличная новость: +' + formatRub(d.amount) + ' уже в балансе. Лимит вырос.';
        }
        if (type === 'stop') {
          if (d.hours >= 12) {
            if (tone === 'sergeant') return 'Это ' + d.hours + ' ч. твоей работы и ' + d.limits + ' дневных лимитов! Руки прочь от кнопки «Купить» — в холодильник на 24 часа!';
            if (tone === 'bro') return 'Бро, ради этой штуки пахать ' + d.hours + ' ч. (' + d.limits + ' дн. бюджета). Кинь на сутки в холодильник — завтра скорее всего отпустит.';
            return 'Покупка стоит ' + d.hours + ' ч. твоего времени (' + d.limits + ' дн. лимита). Пауза в 24 часа поможет принять спокойное решение.';
          }
          if (tone === 'sergeant') return d.hours + ' ч. работы на кону. Если вещи нет в списке нужного — остуди её 24 часа!';
          if (tone === 'bro') return 'Вроде мелочь, а ' + d.hours + ' ч. смены уйдет. Подержи 24 часа на паузе, вдруг это просто магия маркетплейса.';
          return 'Это примерно ' + d.hours + ' ч. твоей работы. Попробуй отложить на 24 часа — так легче отличить важное от импульса.';
        }
        return 'Шаг за шагом к финансовой свободе.';
      }

      // =========================================================================
      // 5. ФИНАНСОВАЯ МАТЕМАТИКА: ДНЕВНОЙ ЛИМИТ И СИМУЛЯТОР АМОРТИЗАЦИИ ДОЛГОВ
      // =========================================================================
      function calcBudgetMetrics(st) {
        const today = getTodayISO();
        const todaySpent = st.transactions
          .filter((t) => t.type === 'expense' && t.date === today)
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);

        const days = Math.max(1, Math.round(Number(st.daysUntilIncome) || 1));
        const balance = Number(st.balance) || 0;
        const mandatory = Math.max(0, Number(st.mandatoryPayments) || 0);

        // Формула: Math.floor((остаток_на_начало_дня - обязательные) / дней) - потрачено_сегодня
        const freePoolNow = balance - mandatory;
        const startOfDayPool = (balance + todaySpent) - mandatory;
        const dailyPlan = Math.floor(startOfDayPool / days);
        const freeToday = freePoolNow <= 0 ? Math.floor(freePoolNow) : dailyPlan - todaySpent;

        const isGap = freeToday <= 0;
        const deficit = isGap ? Math.abs(freeToday) : 0;
        const spentPct = dailyPlan > 0 ? Math.min(100, Math.round((todaySpent / dailyPlan) * 100)) : 100;
        const hourlyRate = Math.max(80, (Number(st.monthlyIncome) || 60000) / 168);

        return {
          today,
          todaySpent,
          days,
          freePoolNow,
          dailyPlan,
          freeToday,
          isGap,
          deficit,
          spentPct,
          hourlyRate,
        };
      }

      function simulateDebts(debts, strategy, extraMonthly) {
        if (!debts || debts.length === 0) {
          return { months: 0, totalInterest: 0, payoffLabel: 'Долгов нет!', ordered: [], warning: '' };
        }

        const priorityIds = debts
          .slice()
          .sort((a, b) => {
            if (strategy === 'avalanche') {
              if (b.rate !== a.rate) return b.rate - a.rate;
              return a.balance - b.balance;
            }
            if (a.balance !== b.balance) return a.balance - b.balance;
            return b.rate - a.rate;
          })
          .map((d) => d.id);

        const list = debts.map((d) => ({
          id: d.id,
          name: d.name,
          balance: Math.max(0, Number(d.balance) || 0),
          remaining: Math.max(0, Number(d.balance) || 0),
          rate: Math.max(0, Number(d.rate) || 0),
          minPayment: Math.max(100, Number(d.minPayment) || 0),
          paymentDay: d.paymentDay || 15,
          priority: priorityIds.indexOf(d.id),
          paidMonth: null,
        }));

        const totalMonthly = list.reduce((s, d) => s + d.minPayment, 0) + Math.max(0, Number(extraMonthly) || 0);
        const startInterest = list.reduce((s, d) => s + (d.remaining * (d.rate / 100)) / 12, 0);
        const warning = totalMonthly <= startInterest
          ? 'Текущие платежи не покрывают начисленные проценты. Добавьте досрочную сумму ползунком.'
          : '';

        let month = 0;
        let totalInterest = 0;
        const MAX_M = 360;

        while (month < MAX_M && list.some((d) => d.remaining > 0.5)) {
          month += 1;
          let budget = totalMonthly;

          // 1. Начисление месячных процентов
          for (let i = 0; i < list.length; i++) {
            const d = list[i];
            if (d.remaining <= 0.5) continue;
            const interest = (d.remaining * (d.rate / 100)) / 12;
            d.remaining += interest;
            totalInterest += interest;
          }

          // 2. Обязательные минимальные платежи
          for (let i = 0; i < list.length; i++) {
            const d = list[i];
            if (d.remaining <= 0.5) continue;
            const pay = Math.min(d.remaining, d.minPayment, budget);
            d.remaining -= pay;
            budget -= pay;
            if (d.remaining <= 0.5) {
              d.remaining = 0;
              if (d.paidMonth === null) d.paidMonth = month;
            }
          }

          // 3. Вся досрочка + освободившиеся платежи бьют в приоритетный долг
          if (budget > 0.5) {
            const active = list.filter((d) => d.remaining > 0.5).sort((a, b) => a.priority - b.priority);
            for (let i = 0; i < active.length; i++) {
              if (budget <= 0.5) break;
              const target = active[i];
              const extra = Math.min(target.remaining, budget);
              target.remaining -= extra;
              budget -= extra;
              if (target.remaining <= 0.5) {
                target.remaining = 0;
                if (target.paidMonth === null) target.paidMonth = month;
              }
            }
          }
        }

        const now = new Date();
        const endDate = new Date(now.getFullYear(), now.getMonth() + month, 1);
        const payoffLabel = month >= MAX_M ? 'Более 30 лет' : MONTHS_RU[endDate.getMonth()] + ' ' + endDate.getFullYear();

        const ordered = list
          .slice()
          .sort((a, b) => a.priority - b.priority)
          .map((d) => {
            const m = d.paidMonth || MAX_M;
            const dt = new Date(now.getFullYear(), now.getMonth() + m, 1);
            return Object.assign({}, d, {
              payoffMonths: m,
              payoffShort: m >= MAX_M ? '> 30 лет' : MONTHS_RU[dt.getMonth()].slice(0, 3) + ' ' + dt.getFullYear(),
            });
          });

        return {
          months: month,
          totalInterest: Math.round(totalInterest),
          payoffLabel,
          ordered,
          warning,
        };
      }

      // =========================================================================
      // 8. ГОЛОСОВОЙ ВВОД (WEB SPEECH API RU-RU)
      // =========================================================================
      function toggleVoice() {
        Storage.haptic('light');
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          showToast('Голосовой ввод не поддерживается в этом браузере — введите трату текстом', 'warn');
          return;
        }
        if (isListening && speechRec) {
          speechRec.stop();
          isListening = false;
          return;
        }
        try {
          speechRec = new SR();
          speechRec.lang = 'ru-RU';
          speechRec.interimResults = false;
          speechRec.maxAlternatives = 1;
          speechRec.onstart = () => {
            isListening = true;
            const b = document.getElementById('voice-btn');
            if (b) b.classList.add('listening');
          };
          speechRec.onend = () => {
            isListening = false;
            const b = document.getElementById('voice-btn');
            if (b) b.classList.remove('listening');
          };
          speechRec.onerror = () => {
            isListening = false;
            showToast('Не удалось распознать голос. Проверьте доступ к микрофону.', 'warn');
          };
          speechRec.onresult = (ev) => {
            const text = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : '';
            const inp = document.getElementById('quick-input');
            if (text && inp) {
              inp.value = inp.value ? inp.value + ' ' + text : text;
              showToast('Услышал: «' + text + '» — нажмите отправить', 'info');
            }
          };
          speechRec.start();
        } catch (_) {
          isListening = false;
          showToast('Браузер заблокировал микрофон', 'warn');
        }
      }

      // =========================================================================
      // 9. ГЕНЕРАТОР КАРТОЧКИ ПРОГРЕССА ДЛЯ STORIES (HTML5 CANVAS)
      // =========================================================================
      function drawStoriesCard() {
        const canvas = document.getElementById('stories-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 540;
        const H = 960;
        canvas.width = W;
        canvas.height = H;

        // Фон
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#0f172a');
        bg.addColorStop(0.55, '#0d1117');
        bg.addColorStop(1, '#052e23');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Световые акценты
        const g1 = ctx.createRadialGradient(460, 140, 10, 460, 140, 260);
        g1.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
        g1.addColorStop(1, 'rgba(16, 185, 129, 0)');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, W, H);

        const g2 = ctx.createRadialGradient(80, 810, 10, 80, 810, 260);
        g2.addColorStop(0, 'rgba(59, 130, 246, 0.24)');
        g2.addColorStop(1, 'rgba(59, 130, 246, 0)');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, W, H);

        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        // Логотип FinExit
        roundRect(44, 56, 178, 52, 26);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.fillStyle = '#042419';
        ctx.font = '900 23px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('₽  FinExit', 68, 90);

        const now = new Date();
        ctx.fillStyle = 'rgba(240,246,252,0.55)';
        ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(MONTHS_RU[now.getMonth()] + ' ' + now.getFullYear(), 345, 90);

        // Заголовок
        ctx.fillStyle = '#f0f6fc';
        ctx.font = '900 44px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Выхожу в плюс', 44, 200);
        ctx.fillText('шаг за шагом', 44, 254);
        ctx.fillStyle = '#10b981';
        ctx.fillText('без стресса', 44, 308);

        const baseSim = simulateDebts(state.debts, state.debtStrategy, 0);
        const activeSim = simulateDebts(state.debts, state.debtStrategy, state.extraMonthlyPayment);
        const monthsSaved = Math.max(0, baseSim.months - activeSim.months);

        // Карточка 1: Серия
        roundRect(44, 365, 452, 136, 26);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#8b949e';
        ctx.font = '700 17px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('КОНТРОЛЬ ДНЕВНОГО ЛИМИТА', 70, 408);
        ctx.fillStyle = '#f0f6fc';
        ctx.font = '900 42px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText((state.streakDays || 1) + ' дн. в ритме 🔥', 70, 466);

        // Карточка 2: Ускорение по долгам (без раскрытия приватной суммы долга!)
        roundRect(44, 523, 452, 136, 26);
        ctx.fillStyle = 'rgba(59, 130, 246, 0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.35)';
        ctx.stroke();

        ctx.fillStyle = '#93c5fd';
        ctx.font = '700 17px -apple-system, BlinkMacSystemFont, sans-serif';
        if (state.debts.length > 0 && monthsSaved > 0) {
          ctx.fillText('УСКОРЕНИЕ ВЫХОДА ИЗ ДОЛГОВ', 70, 566);
          ctx.fillStyle = '#f0f6fc';
          ctx.font = '900 40px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.fillText('Раньше на ' + monthsSaved + ' мес.', 70, 624);
        } else if (state.debts.length > 0) {
          ctx.fillText('ЦЕЛЬ ФИНАНСОВОЙ СВОБОДЫ', 70, 566);
          ctx.fillStyle = '#f0f6fc';
          ctx.font = '900 36px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.fillText(activeSim.payoffLabel, 70, 624);
        } else {
          ctx.fillText('СТАТУС ПО КРЕДИТАМ', 70, 566);
          ctx.fillStyle = '#34d399';
          ctx.font = '900 38px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.fillText('Свобода от долгов ✨', 70, 624);
        }

        // Карточка 3: Спасено на Стоп-кране
        roundRect(44, 681, 452, 136, 26);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.stroke();

        ctx.fillStyle = '#6ee7b7';
        ctx.font = '700 17px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('СПАСЕНО НА СТОП-КРАНЕ WB/OZON', 70, 724);
        ctx.fillStyle = '#10b981';
        ctx.font = '900 42px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(state.savedFromImpulse > 0 ? formatRub(state.savedFromImpulse) : 'Импульсы под замком', 70, 782);

        // Подвал
        ctx.fillStyle = '#8b949e';
        ctx.font = '500 17px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Приватный отчет • точные суммы счетов скрыты', 44, 892);
        ctx.fillStyle = '#10b981';
        ctx.font = '800 18px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('#FinExit  #финансыподконтролем', 44, 924);
      }

      // =========================================================================
      // 10. РЕНДЕР ОНБОРДИНГА И 4 ВКЛАДОК
      // =========================================================================
      function renderOnboarding() {
        if (!obDraft) {
          obDraft = {
            mode: state.mode,

          };
        }

        const previewDaily = () => {
          const b = Number(obDraft.balance) || 0;
          const m = Number(obDraft.mandatoryPayments) || 0;
          const d = Math.max(1, Number(obDraft.daysUntilIncome) || 1);
          return Math.floor((b - m) / d);
        };

        const root = document.getElementById('app-root');
        root.innerHTML =
          '<div class="ob-wrap">' +
            '<div>' +
              '<div class="row-between">' +
                '<div class="brand-row">' +
                  '<div class="brand-logo">₽</div>' +
                  '<div>' +
                    '<div class="brand-title">FinExit</div>' +
                    '<div class="sync-badge ' + (Storage.getBadge().cloud ? 'cloud' : '') + '" data-storage-badge>' + Storage.getBadge().text + '</div>' +
                  '</div>' +
                '</div>' +
                '<button id="ob-demo" class="btn btn-sm" style="background:var(--emerald-soft);color:var(--emerald);border:1px solid rgba(16,185,129,0.35);">✨ Демо-данные</button>' +
              '</div>' +

              '<div class="ob-steps">' +
                [1, 2, 3].map((s) => '<div class="ob-step-bar ' + (s <= obStep ? 'active' : '') + '"></div>').join('') +
              '</div>' +

              (obStep === 1
                ? '<div class="stack anim-in">' +
                    '<div><h1 style="font-size:24px;font-weight:900;margin:0 0 6px;">Какая главная цель?</h1><p class="muted" style="margin:0;">Подстроим FinExit под вашу задачу за 60 секунд.</p></div>' +
                    GOALS_MODES.map((m) =>
                      '<button data-obmode="' + m.id + '" class="choice-card ' + (obDraft.mode === m.id ? 'selected' : '') + '">' +
                        '<span class="choice-emoji">' + m.emoji + '</span>' +
                        '<div><div style="font-weight:700;font-size:15px;">' + m.title + '</div><div class="muted" style="margin-top:3px;">' + m.desc + '</div></div>' +
                      '</button>'
                    ).join('') +
                  '</div>'
                : '') +

              (obStep === 2
                ? '<div class="stack anim-in">' +
                    '<div><h1 style="font-size:24px;font-weight:900;margin:0 0 6px;">Характер ИИ-наставника</h1><p class="muted" style="margin:0;">Никакого стыда за траты — выберите комфортный тон.</p></div>' +
                    TONES.map((t) =>
                      '<button data-obtone="' + t.id + '" class="choice-card ' + (obDraft.tone === t.id ? 'selected' : '') + '" style="flex-direction:column;gap:8px;">' +
                        '<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:22px;">' + t.emoji + '</span><div><div style="font-weight:700;font-size:15px;">' + t.title + '</div><div class="muted">' + t.desc + '</div></div></div>' +
                        '<div class="card-soft" style="width:100%;font-size:12px;font-style:italic;color:#c9d1d9;">' + t.preview + '</div>' +
                      '</button>'
                    ).join('') +
                  '</div>'
                : '') +

              (obStep === 3
                ? '<div class="stack anim-in">' +
                    '<div><h1 style="font-size:24px;font-weight:900;margin:0 0 6px;">Базовые цифры</h1><p class="muted" style="margin:0;">Пароли от банков не нужны. Данные хранятся только у вас.</p></div>' +
                    '<div class="card stack">' +
                      '<div><label class="label">Текущий свободный остаток на руках/картах (₽)</label><input id="ob-bal" class="input input-lg" type="number" inputmode="numeric" value="' + esc(obDraft.balance) + '" /></div>' +
                      '<div><label class="label">Обязательные платежи до дохода — кредиты, жилье, ЖКХ (₽)</label><input id="ob-mand" class="input input-lg" type="number" inputmode="numeric" value="' + esc(obDraft.mandatoryPayments) + '" /></div>' +
                      '<div class="grid-2">' +
                        '<div><label class="label">Дней до дохода</label><input id="ob-days" class="input" type="number" inputmode="numeric" min="1" value="' + esc(obDraft.daysUntilIncome) + '" /></div>' +
                        '<div><label class="label">Доход в месяц (₽)</label><input id="ob-inc" class="input" type="number" inputmode="numeric" value="' + esc(obDraft.monthlyIncome) + '" /></div>' +
                      '</div>' +
                    '</div>' +

                      '</div>' +
                    '</div>' +
                  '</div>'
                : '') +
            '</div>' +

              '<button id="ob-next" class="btn btn-primary" style="flex:1;">' + (obStep < 3 ? 'Продолжить →' : 'Запустить FinExit ✨') + '</button>' +
            '</div>' +
          '</div>';

        document.getElementById('ob-demo').onclick = () => {
          Storage.haptic('medium');
          state = createDemoState(Storage.userName || 'Алексей');
          persist(true);
          showToast('Демо-данные загружены! Попробуйте быстрый ввод и ползунок долгов.', 'success');
          render();
        };

        document.querySelectorAll('[data-obmode]').forEach((b) => {
          b.onclick = () => { Storage.haptic('light'); obDraft.mode = b.dataset.obmode; renderOnboarding(); };
        });

        document.querySelectorAll('[data-obtone]').forEach((b) => {
          b.onclick = () => { Storage.haptic('light'); obDraft.tone = b.dataset.obtone; renderOnboarding(); };
        });

        if (obStep === 3) {
          const updatePrev = () => {
            obDraft.balance = document.getElementById('ob-bal').value;
            obDraft.mandatoryPayments = document.getElementById('ob-mand').value;
            obDraft.daysUntilIncome = document.getElementById('ob-days').value;
            obDraft.monthlyIncome = document.getElementById('ob-inc').value;
            const el = document.getElementById('ob-prev');
            if (el) el.textContent = formatRub(previewDaily());
          };
          ['ob-bal', 'ob-mand', 'ob-days', 'ob-inc'].forEach((id) => {
            document.getElementById(id).addEventListener('input', updatePrev);
          });
        }

        const back = document.getElementById('ob-back');
        if (back) back.onclick = () => { obStep -= 1; renderOnboarding(); };

        document.getElementById('ob-next').onclick = () => {
          Storage.haptic('medium');
          if (obStep < 3) {
            obStep += 1;
            renderOnboarding();
          } else {
            state.onboarded = true;
            state.mode = obDraft.mode;
            state.tone = obDraft.tone;
            state.balance = Math.max(0, Math.round(Number(obDraft.balance) || 0));
            state.mandatoryPayments = Math.max(0, Math.round(Number(obDraft.mandatoryPayments) || 0));
            state.daysUntilIncome = Math.max(1, Math.round(Number(obDraft.daysUntilIncome) || 10));
            state.monthlyIncome = Math.max(5000, Math.round(Number(obDraft.monthlyIncome) || 60000));
            persist(true);
            showToast('FinExit настроен! Запишите первую трату в строку ниже.', 'success');
            render();
          }
        };
      }

      // ---- ВКЛАДКА 3: СТОП-КРАН И КОПИЛКИ ----
      function htmlStopPreview(m) {
        const price = Math.max(0, Number(stopDraft.price) || 0);

        const hours = +(price / m.hourlyRate).toFixed(1);
        const shifts = +(hours / 8).toFixed(1);
        const baseLimit = Math.max(300, Math.abs(m.dailyPlan) || 1000);
        const limits = +(price / baseLimit).toFixed(1);
        const toneObj = TONES.find((t) => t.id === state.tone) || TONES[0];

        return (
          '<div class="card-soft stack anim-in" style="margin-top:4px;">' +
            '<div class="grid-3" style="text-align:center;">' +
              '<div style="background:var(--bg);padding:10px 6px;border-radius:12px;"><div class="stat-label">Твой труд</div><div style="font-size:16px;font-weight:900;color:var(--amber);margin-top:2px;">' + hours + ' ч.</div></div>' +
              '<div style="background:var(--bg);padding:10px 6px;border-radius:12px;"><div class="stat-label">Смен (8ч)</div><div style="font-size:16px;font-weight:900;margin-top:2px;">' + shifts + '</div></div>' +
              '<div style="background:var(--bg);padding:10px 6px;border-radius:12px;"><div class="stat-label">Дн. лимитов</div><div style="font-size:16px;font-weight:900;color:var(--red);margin-top:2px;">' + limits + '</div></div>' +

                    '<div class="card stack">' +
                      '<div class="row-between">' +

                          '<div><div style="font-weight:700;font-size:14px;">' + esc(g.name) + '</div><div class="muted">' + formatRub(g.current) + ' из ' + formatRub(g.target) + '</div></div>' +
                        '</div>' +
                        '<span style="font-weight:900;color:var(--emerald);">' + pct + '%</span>' +

                      '</div>' +
                    '</div>'
                  );
                }).join('')) +

        );
      }

      // =========================================================================
      // 11. ГЛАВНАЯ ФУНКЦИЯ РЕНДЕРА И НАВЕШИВАНИЕ ОБРАБОТЧИКОВ
      // =========================================================================
      function render() {
        if (!state.onboarded) {
          renderOnboarding();
          return;
        }

        const m = calcBudgetMetrics(state);
        const badge = Storage.getBadge();
        const root = document.getElementById('app-root');

        let contentHTML = '';
        if (activeTab === 'home') contentHTML = htmlHomeTab(m);
        else if (activeTab === 'debts') contentHTML = htmlDebtsTab();
        else if (activeTab === 'stop') contentHTML = htmlStopTab(m);
        else contentHTML = htmlProfileTab();

        root.innerHTML =
          '<header class="app-header">' +
            '<div class="brand-row">' +
              '<div class="brand-logo">₽</div>' +
              '<div>' +
                '<div class="brand-title">FinExit</div>' +
                '<div class="sync-badge ' + (badge.cloud ? 'cloud' : '') + '" data-storage-badge>' + badge.text + '</div>' +
              '</div>' +
            '</div>' +
            '<button id="hdr-demo" class="btn btn-sm btn-soft" style="font-size:11px;padding:7px 10px;">✨ Демо</button>' +
          '</header>' +

          '<main class="main-content">' + contentHTML + '</main>' +

          '<nav class="bottom-nav">' +
            [
              { id: 'home', label: 'Главная', icon: SVG.wallet },
              { id: 'debts', label: 'Долги', icon: SVG.flame },
              { id: 'stop', label: 'Стоп-кран', icon: SVG.stop },
              { id: 'profile', label: 'Профиль', icon: SVG.user },
            ].map((t) =>
              '<button type="button" data-tab="' + t.id + '" class="nav-btn ' + (activeTab === t.id ? 'active' : '') + '">' +
                t.icon + '<span>' + t.label + '</span>' +
              '</button>'
            ).join('') +
          '</nav>';

        // Шапка и таббар
        document.getElementById('hdr-demo').onclick = () => {
          Storage.haptic('medium');
          state = createDemoState(Storage.userName || state.userName || 'Алексей');
          activeTab = 'home';
          persist(true);
          showToast('Загружены демо-данные РФ', 'success');
          render();
        };

        document.querySelectorAll('[data-tab]').forEach((b) => {
          b.onclick = () => {
            Storage.haptic('light');
            activeTab = b.dataset.tab;
            render();
            window.scrollTo(0, 0);
          };
        });

        // --- Обработчики вкладки ГЛАВНАЯ ---
        if (activeTab === 'home') {
          document.getElementById('quick-form').onsubmit = (e) => {
            e.preventDefault();
            const inp = document.getElementById('quick-input');
            const items = parseQuickInput(inp.value);
            if (!items.length) {
              return showToast('Укажите сумму, например: «Пятерочка 1450 и кофе 250»', 'warn');
            }
            let delta = 0;
            items.forEach((it) => { delta += it.type === 'income' ? it.amount : -it.amount; });
            state.balance += delta;
            state.transactions = items.concat(state.transactions);
            inp.value = '';
            persist();
            Storage.haptic('medium');
            const sum = items.reduce((s, it) => s + it.amount, 0);
            const isIncOnly = items.length === 1 && items[0].type === 'income';
            const msg = getMentorText(state.tone, isIncOnly ? 'income' : 'expense', { amount: sum });
            showToast(items.length > 1 ? 'Разобрал ' + items.length + ' операции! ' + msg : msg, 'success');
            render();
          };

          document.getElementById('voice-btn').onclick = toggleVoice;
          document.getElementById('btn-add-tx').onclick = openManualTxModal;
          document.getElementById('btn-lazy-sync').onclick = openLazySyncModal;

          document.querySelectorAll('[data-chip]').forEach((c) => {
            c.onclick = () => {
              Storage.haptic('light');
              const inp = document.getElementById('quick-input');
              if (inp) { inp.value = c.dataset.chip; inp.focus(); }
            };
          });

          document.querySelectorAll('[data-del-tx]').forEach((b) => {
            b.onclick = () => {
              Storage.haptic('light');
              const id = b.dataset.delTx;
              const tx = state.transactions.find((t) => t.id === id);
              if (!tx) return;
              state.balance += tx.type === 'income' ? -tx.amount : tx.amount;
              state.transactions = state.transactions.filter((t) => t.id !== id);
              persist();
              showToast('Операция удалена, баланс пересчитан', 'info');
              render();
            };
          });
        }

        // --- Обработчики вкладки ДОЛГИ ---
        if (activeTab === 'debts') {
          const addBtn = document.getElementById('btn-add-debt');
          if (addBtn) addBtn.onclick = openAddDebtModal;
          const addEmpty = document.getElementById('btn-add-debt-empty');
          if (addEmpty) addEmpty.onclick = openAddDebtModal;

          document.querySelectorAll('[data-strat]').forEach((b) => {
            b.onclick = () => {
              Storage.haptic('light');
              state.debtStrategy = b.dataset.strat;
              persist();
              render();
            };
          });

          const bindDebtDeletes = () => {
            document.querySelectorAll('[data-del-debt]').forEach((b) => {
              b.onclick = () => {
                Storage.haptic('light');
                state.debts = state.debts.filter((d) => d.id !== b.dataset.delDebt);
                persist();
                showToast('Долг удален из списка', 'info');
                render();
              };
            });
          };
          bindDebtDeletes();

          const slider = document.getElementById('debt-slider');
          if (slider) {
            slider.addEventListener('input', () => {
              state.extraMonthlyPayment = Number(slider.value) || 0;
              const totalDebt = state.debts.reduce((s, d) => s + (Number(d.balance) || 0), 0);
              const totalMin = state.debts.reduce((s, d) => s + (Number(d.minPayment) || 0), 0);
              const base = simulateDebts(state.debts, state.debtStrategy, 0);
              const active = simulateDebts(state.debts, state.debtStrategy, state.extraMonthlyPayment);
              const mSaved = Math.max(0, base.months - active.months);
              const iSaved = Math.max(0, base.totalInterest - active.totalInterest);

              const elExtra = document.getElementById('d-extra-lbl');
              const elTot = document.getElementById('d-total-m');
              const elPay = document.getElementById('d-payoff');
              const elM = document.getElementById('d-msaved');
              const elI = document.getElementById('d-isaved');
              const elList = document.getElementById('debt-list');

              if (elExtra) elExtra.textContent = '+' + formatRub(state.extraMonthlyPayment) + '/мес';
              if (elTot) elTot.textContent = formatRub(totalMin + state.extraMonthlyPayment);
              if (elPay) elPay.textContent = active.payoffLabel;
              if (elM) elM.textContent = mSaved > 0 ? 'на ' + mSaved + ' мес.' : 'Базовый план';
              if (elI) elI.textContent = formatRub(iSaved);
              if (elList) {
                elList.innerHTML = renderDebtCardsHTML(active.ordered, totalDebt);
                bindDebtDeletes();
              }
            });
            slider.addEventListener('change', () => {
              Storage.haptic('light');
              persist();
            });
          }
        }

        // --- Обработчики вкладки СТОП-КРАН ---
        if (activeTab === 'stop') {
          const bindFreeze = () => {
            const fb = document.getElementById('btn-freeze-24h');
            if (fb) {
              fb.onclick = () => {
                const price = Math.round(Number(stopDraft.price));
                if (!price || price <= 0) return;
                state.wishlist.unshift({
                  id: 'w-' + Date.now(),
                  name: stopDraft.name.trim() || 'Покупка на маркетплейсе',
                  price,
                  createdAt: Date.now(),
                });
                stopDraft = { name: '', price: '' };
                persist();
                Storage.haptic('medium');
                showToast('Отложено на 24 часа! Выдержка прокачана.', 'success');
                render();
              };
            }
          };
          bindFreeze();

          const sn = document.getElementById('stop-name');
          const sp = document.getElementById('stop-price');
          if (sn) sn.addEventListener('input', () => { stopDraft.name = sn.value; });
          if (sp) {
            sp.addEventListener('input', () => {
              stopDraft.price = sp.value;
              const prev = document.getElementById('stop-preview');
              if (prev) {
                prev.innerHTML = htmlStopPreview(calcBudgetMetrics(state));
                bindFreeze();
              }
            });
          }

          document.querySelectorAll('[data-wish-save]').forEach((b) => {
            b.onclick = () => {
              const w = state.wishlist.find((x) => x.id === b.dataset.wishSave);
              if (!w) return;
              state.savedFromImpulse += w.price;
              state.wishlist = state.wishlist.filter((x) => x.id !== w.id);
              persist();
              Storage.haptic('heavy');
              showToast('Победа! Вы сэкономили ' + formatRub(w.price) + '!', 'success');
              render();
            };
          });

          document.querySelectorAll('[data-wish-buy]').forEach((b) => {
            b.onclick = () => {
              const w = state.wishlist.find((x) => x.id === b.dataset.wishBuy);
              if (!w) return;
              state.balance -= w.price;
              state.transactions.unshift({
                id: 'tx-w-' + Date.now(),
                title: w.name,
                amount: w.price,
                type: 'expense',
                category: 'Маркетплейсы',
                date: getTodayISO(),
              });
              state.wishlist = state.wishlist.filter((x) => x.id !== w.id);
              persist();
              showToast('Покупка «' + w.name + '» учтена в расходах', 'info');
              render();
            };
          });

          document.getElementById('btn-add-goal').onclick = openAddGoalModal;

          document.querySelectorAll('[data-topup]').forEach((b) => {
            b.onclick = () => {
              const id = b.dataset.topup;
              const amt = Number(b.dataset.amt) || 500;
              state.balance -= amt;
              state.goals = state.goals.map((g) => (g.id === id ? Object.assign({}, g, { current: g.current + amt }) : g));
              state.transactions.unshift({
                id: 'tx-g-' + Date.now(),
                title: 'Пополнение копилки',
                amount: amt,
                type: 'expense',
                category: 'Прочее',
                date: getTodayISO(),
              });
              persist();
              Storage.haptic('medium');
              showToast('+' + formatRub(amt) + ' отправлено в копилку!', 'success');
              render();
            };
          });

          document.querySelectorAll('[data-del-goal]').forEach((b) => {
            b.onclick = () => {
              state.goals = state.goals.filter((g) => g.id !== b.dataset.delGoal);
              persist();
              showToast('Копилка удалена', 'info');
              render();
            };
          });
        }

        // --- Обработчики вкладки ПРОФИЛЬ ---
        if (activeTab === 'profile') {
          drawStoriesCard();

          document.getElementById('prof-budget-form').onsubmit = (e) => {
            e.preventDefault();
            state.balance = Math.max(0, Math.round(Number(document.getElementById('pf-bal').value) || 0));
            state.mandatoryPayments = Math.max(0, Math.round(Number(document.getElementById('pf-mand').value) || 0));
            state.daysUntilIncome = Math.max(1, Math.round(Number(document.getElementById('pf-days').value) || 1));
            state.monthlyIncome = Math.max(5000, Math.round(Number(document.getElementById('pf-inc').value) || 60000));
            persist(true);
            Storage.haptic('medium');
            showToast('Параметры бюджета сохранены', 'success');
            render();
          };

          document.querySelectorAll('[data-ptone]').forEach((b) => {
            b.onclick = () => {
              Storage.haptic('light');
              state.tone = b.dataset.ptone;
              persist();
              showToast('Характер наставника обновлен', 'info');
              render();
            };
          });

          document.querySelectorAll('[data-pmode]').forEach((b) => {
            b.onclick = () => {
              Storage.haptic('light');
              state.mode = b.dataset.pmode;
              persist();
              showToast('Режим работы изменен', 'info');
              render();
            };
          });

          document.getElementById('btn-dl-story').onclick = () => {
            Storage.haptic('medium');
            const canvas = document.getElementById('stories-canvas');
            if (!canvas) return;
            try {
              const link = document.createElement('a');
              link.download = 'finexit-story-' + getTodayISO() + '.png';
              link.href = canvas.toDataURL('image/png');
              document.body.appendChild(link);
              link.click();
              link.remove();
              showToast('PNG-карточка для Stories сохранена!', 'success');
            } catch (_) {
              showToast('Зажмите картинку пальцем, чтобы сохранить её в галерею', 'info');
            }
          };

          document.getElementById('btn-prof-demo').onclick = () => {
            Storage.haptic('medium');
            state = createDemoState(Storage.userName || state.userName || 'Алексей');
            activeTab = 'home';
            persist(true);
            showToast('Загружены демо-данные РФ', 'success');
            render();
          };

          document.getElementById('btn-prof-reset').onclick = openConfirmResetModal;
        }
      }

      // =========================================================================
      // 12. ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
      // =========================================================================
      async function boot() {
        Storage.init();
        const local = Storage.loadLocal();
        const defName = Storage.userName || 'Друг';

        if (local) {
          state = Object.assign(createEmptyState(defName), local);
          if (Storage.userName && (!state.userName || state.userName === 'Друг')) {
            state.userName = Storage.userName;
          }
        } else {
          state = createEmptyState(defName);
        }

        render();

        // Асинхронная синхронизация с Telegram CloudStorage (если открыто в Telegram)
        if (Storage.hasCloud) {
          const cloud = await Storage.loadCloud();
          if (cloud && (!local || (cloud.updatedAt || 0) >= (local.updatedAt || 0))) {
            state = Object.assign(createEmptyState(defName), cloud);
            if (Storage.userName && (!state.userName || state.userName === 'Друг')) {
              state.userName = Storage.userName;
            }
            Storage.saveLocal(state);
            render();
          } else if (local && !cloud && local.onboarded) {
            Storage.saveCloud(state);
          }
          updateStorageBadges();
        }

        // Обновление таймеров на вкладке Стоп-кран раз в минуту
        setInterval(() => {
          if (activeTab === 'stop' && state.onboarded && state.wishlist.length > 0) {
            render();
          }
        }, 60000);
      }

      window.addEventListener('DOMContentLoaded', boot);
    })();
  </script>
</body>
</html>
