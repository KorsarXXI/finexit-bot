<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FinExit — Личный финансовый навигатор</title>

  <!-- iOS PWA мета-теги для добавления на экран «Домой» -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinExit" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Единственный внешний скрипт: Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* =========================================================================
       ДИЗАЙН-ТОКЕНЫ И БАЗОВЫЕ СТИЛИ (ЧИСТЫЙ CSS, БЕЗ ВНЕШНИХ ЗАВИСИМОСТЕЙ)
       ========================================================================= */
    :root {
      --bg: #0d1117;
      --bg-outer: #070a0f;
      --card: #161b22;
      --card-soft: #1f2630;
      --card-hover: #262f3b;
      --border: rgba(240, 246, 252, 0.08);
      --border-strong: rgba(240, 246, 252, 0.16);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --purple: #a855f7;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-outer);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* Контейнер мобильного приложения */
    .app-shell {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.65);
      overflow-x: hidden;
    }

    /* Всплывающие уведомления (Тосты) */
    .toast-root {
      position: fixed;
      top: calc(12px + var(--sat));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 420px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1f2937;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      animation: slideDown 0.22s ease-out;
    }

    .toast.success { background: #064e3b; border-color: rgba(16, 185, 129, 0.5); }
    .toast.warn { background: #7f1d1d; border-color: rgba(239, 68, 68, 0.5); }
    .toast.info { background: #1e293b; border-color: rgba(59, 130, 246, 0.45); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-in {
      animation: fadeUp 0.2s ease-out both;
    }

    /* Шапка приложения */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(12px + var(--sat)) 16px 10px;
      background: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #06281e;
      font-weight: 900;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sync-badge.cloud {
      color: var(--emerald);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: transform 0.12s, background 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Основной скроллируемый контент */
    .main-content {
      flex: 1;
      padding: 12px 16px calc(92px + var(--sab));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Карточки */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
    }

    .card-soft {
      background: var(--card-soft);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    /* Герой-карточка «Свободно на сегодня» */
    .hero-card {
      border-radius: 24px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #132a24 0%, #161b22 55%, #111827 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hero-card.danger {
      background: linear-gradient(145deg, #450a0a 0%, #2a0d12 60%, #161b22 100%);
      border-color: rgba(239, 68, 68, 0.55);
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.2);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .hero-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--emerald);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-card.danger .hero-label {
      color: #fca5a5;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      white-space: nowrap;
    }

    .hero-amount {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 6px 0 10px;
    }

    .hero-card.danger .hero-amount {
      color: #fecaca;
    }

    .mentor-box {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #e6edf3;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Прогресс-бары */
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Поля ввода и кнопки */
    .input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .input:focus {
      border-color: var(--emerald);
    }

    .input::placeholder {
      color: #6e7681;
    }

    .input-lg {
      font-size: 18px;
      font-weight: 800;
      padding: 13px 14px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.12s, opacity 0.15s, background 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: var(--emerald);
      color: #042419;
    }

    .btn-blue {
      background: var(--blue);
      color: #ffffff;
    }

    .btn-amber {
      background: var(--amber);
      color: #1f1300;
    }

    .btn-soft {
      background: var(--card-soft);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-danger-soft {
      background: var(--red-soft);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-sm {
      padding: 9px 12px;
      font-size: 12px;
      border-radius: 12px;
    }

    /* Умный быстрый ввод */
    .quick-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .quick-input-wrap {
      position: relative;
      flex: 1;
    }

    .quick-input-wrap .input {
      padding-right: 44px;
    }

    .voice-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .voice-btn.listening {
      background: var(--red);
      color: #fff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .chip:active {
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* Сетки и утилиты */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stack-sm {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0;
    }

    .muted {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Списки транзакций и долгов */
    .tx-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .tx-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: var(--card-soft);
      flex-shrink: 0;
    }

    .tx-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tx-sum {
      font-size: 14px;
      font-weight: 800;
    }

    .tx-sum.inc {
      color: var(--emerald);
    }

    .del-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #6e7681;
      transition: color 0.15s, background 0.15s;
    }

    .del-btn:hover, .del-btn:active {
      color: var(--red);
      background: var(--red-soft);
    }

    /* Переключатель сегментов */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #0d1117;
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .seg-btn {
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .seg-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .seg-btn.active.emerald {
      background: var(--emerald);
      color: #042419;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .seg-btn.active.red {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Ползунок симулятора долгов */
    input[type="range"].fx-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #262f3b;
      outline: none;
      margin: 8px 0;
    }

    input[type="range"].fx-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--emerald);
      border: 3px solid #0d1117;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);
      cursor: pointer;
    }

    /* Карточка долга */
    .debt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .debt-card.priority {
      border-color: rgba(239, 68, 68, 0.65);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .badge-red { background: var(--red-soft); color: #fca5a5; }
    .badge-emerald { background: var(--emerald-soft); color: #6ee7b7; }
    .badge-blue { background: var(--blue-soft); color: #93c5fd; }
    .badge-amber { background: var(--amber-soft); color: #fcd34d; }
    .badge-muted { background: var(--card-soft); color: var(--text-muted); }

    /* Онбординг */
    .ob-wrap {
      flex: 1;
      padding: calc(16px + var(--sat)) 18px calc(24px + var(--sab));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .ob-steps {
      display: flex;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .ob-step-bar {
      height: 5px;
      flex: 1;
      border-radius: 999px;
      background: var(--card-soft);
      transition: background 0.2s;
    }

    .ob-step-bar.active {
      background: var(--emerald);
    }

    .choice-card {
      width: 100%;
      text-align: left;
      padding: 14px;
      border-radius: 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .choice-card.selected {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.08);
    }

    .choice-emoji {
      font-size: 24px;
      line-height: 1;
      margin-top: 2px;
    }

    /* Нижняя навигация (4 вкладки) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 30;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(10px + var(--sab));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 14px;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }

    .nav-btn.active {
      color: var(--emerald);
      background: var(--emerald-soft);
    }

    .nav-btn span {
      font-size: 11px;
      font-weight: 700;
    }

    /* Модальные окна (без alert / confirm) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    @media (min-width: 500px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      background: #161b22;
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      animation: fadeUp 0.18s ease-out;
    }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      border-radius: 14px;
      background: var(--card-soft);
      border: 1.5px solid transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .cat-btn.active {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: var(--text);
    }

    /* Canvas для Stories */
    .story-canvas-wrap {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    #stories-canvas {
      width: 190px;
      height: auto;
      aspect-ratio: 9 / 16;
      border-radius: 1
